<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Story Stars</title>
<style>
:root{
  --ink:#4a3b5c; --sky:#6ec6ff; --sky2:#bfe9ff; --grass:#7ed957; --paper:#fffaf0;
  --red:#ff6b6b; --yellow:#ffd84d; --blue:#4dabff; --purple:#7c5cff; --pink:#ff8fc7;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{height:100%;margin:0}
body{font-family:system-ui,"Nunito","Roboto",sans-serif;color:var(--ink);overflow:hidden;
  background:linear-gradient(var(--sky),var(--sky2) 70%)}
input,select{user-select:text;-webkit-user-select:text;font:inherit;color:inherit}
button{font:inherit;color:inherit;border:0;cursor:pointer;background:none}

/* sky */
.cloud{position:fixed;background:#fff;border-radius:60px;opacity:.85;height:34px;width:110px;animation:drift 60s linear infinite}
.cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
.cloud::before{width:50px;height:50px;left:16px;top:-24px}
.cloud::after{width:38px;height:38px;left:54px;top:-16px}
.c1{top:14%;left:-130px}.c2{top:30%;left:-130px;animation-duration:85s;animation-delay:-40s;transform:scale(.7)}
@keyframes drift{to{left:110%}}
.hill{position:fixed;left:-20%;right:-20%;bottom:-16vh;height:28vh;background:var(--grass);border-radius:50% 50% 0 0}
.hill.b{left:30%;right:-40%;bottom:-18vh;background:#5fc94a}

.screen{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;padding:14px 14px 34px;gap:12px}
.screen.on{display:flex}

/* the two corner things */
.corner{position:fixed;top:10px;border-radius:50%;background:#fff;z-index:9;display:none;align-items:center;justify-content:center;
  box-shadow:0 4px 0 rgba(74,59,92,.2)}
#homeBtn,#cog{left:10px;width:44px;height:44px;font-size:20px;opacity:.5}
body[data-screen=home] #cog{display:flex}
body[data-screen=pick] #homeBtn,body[data-screen=story] #homeBtn,body[data-screen=msg] #homeBtn{display:flex}
#homeBtn.holding{opacity:1;animation:fill .7s linear forwards}
@keyframes fill{to{box-shadow:0 0 0 8px var(--yellow)}}

/* Stella, the storyteller */
#star{right:10px;width:70px;height:70px;font-size:40px;transition:transform .2s}
body[data-screen=home] #star,body[data-screen=pick] #star,body[data-screen=story] #star,body[data-screen=msg] #star{display:flex}
#star.talk{animation:chat .5s ease-in-out infinite;box-shadow:0 0 0 6px var(--yellow),0 4px 0 rgba(74,59,92,.2)}
#star.listen{background:var(--grass);animation:pulse 1s ease-in-out infinite}
#star.wait{background:#dff5d6}
@keyframes chat{50%{transform:translateY(-5px) rotate(6deg) scale(1.06)}}
@keyframes pulse{50%{box-shadow:0 0 0 18px rgba(126,217,87,.4)}}

/* home */
#home{justify-content:center;gap:22px;text-align:center}
#home h1{font-size:34px;margin:0;color:#fff;text-shadow:0 3px 0 var(--purple),0 8px 14px rgba(74,59,92,.3)}
.mascot{font-size:110px;line-height:1;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-14px) rotate(-4deg)}}
#go{width:190px;height:190px;border-radius:50%;background:var(--yellow);font-size:96px;color:#fff;padding-left:14px;
  text-shadow:0 5px 0 #d9a900;box-shadow:0 10px 0 #d9a900,0 18px 26px rgba(74,59,92,.3);animation:beat 1.4s ease-in-out infinite}
#go:active{transform:translateY(6px);box-shadow:0 4px 0 #d9a900}
@keyframes beat{50%{transform:scale(1.07);box-shadow:0 10px 0 #d9a900,0 0 0 16px rgba(255,216,77,.45)}}
#setupHint{display:none;background:#fff;border-radius:20px;padding:10px 16px;font-size:15px;font-weight:700}

/* picture cards: the only things she ever needs to tap */
#pick{justify-content:center;gap:24px}
.choices{position:relative;display:flex;gap:14px;width:100%;max-width:560px;justify-content:center}
.card{flex:1 1 0;min-width:0;max-width:240px;border-radius:30px;padding:12px 8px 14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  font-weight:800;font-size:18px;line-height:1.15;text-align:center;min-height:150px;
  box-shadow:0 8px 0 rgba(74,59,92,.28);transition:transform .15s;animation:pop .35s backwards}
.card:nth-child(1){background:var(--red);color:#fff}
.card:nth-child(2){background:var(--yellow);animation-delay:.1s}
.card:nth-child(3){background:var(--blue);color:#fff;animation-delay:.2s}
.card .em{font-size:70px;line-height:1.05}
.three .card{min-height:128px;font-size:15px;border-radius:24px}.three .card .em{font-size:50px}
.three{gap:10px}
.card.lit{transform:scale(1.1) rotate(-2deg);box-shadow:0 8px 0 rgba(74,59,92,.28),0 0 0 7px #fff}
.card.won{animation:won .6s forwards}
.card:active{transform:scale(.94)}
.turn .card{animation:nod 1.8s ease-in-out infinite}
.turn .card:nth-child(2){animation-delay:.6s}.turn .card:nth-child(3){animation-delay:1.2s}
.turn::after{content:"👆";position:absolute;bottom:-30px;left:50%;font-size:40px;animation:point 1.8s ease-in-out infinite;pointer-events:none}
@keyframes pop{from{transform:scale(.3);opacity:0}}
@keyframes won{40%{transform:scale(1.25) rotate(4deg)}100%{transform:scale(1.1)}}
@keyframes nod{15%{transform:translateY(-10px) rotate(-3deg)}30%{transform:none}}
@keyframes point{0%,100%{transform:translate(-130%,0)}50%{transform:translate(30%,-8px)}}

/* story */
#story{padding-top:86px;gap:12px;justify-content:flex-start}
#book{display:flex;flex-direction:column;align-items:center;gap:12px;width:100%;max-width:560px;flex:1;min-height:0}
#pic{position:relative;width:100%;aspect-ratio:4/3;max-height:42vh;background:var(--paper);border-radius:28px;border:6px solid #fff;
  box-shadow:0 8px 18px rgba(74,59,92,.25);overflow:hidden;flex-shrink:1}
#ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:100px;
  background:radial-gradient(circle at 50% 60%,#fff6c9,#ffe0f0)}
#ph span{animation:bob 1.6s ease-in-out infinite}
#ph::after{content:"✏️";position:absolute;right:16px;bottom:10px;font-size:30px;animation:scribble 1s ease-in-out infinite}
#ph.still::after{display:none}
@keyframes scribble{50%{transform:translate(-10px,-6px) rotate(-14deg)}}
#pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none;animation:fade .7s}
#pic img.on{display:block}
@keyframes fade{from{opacity:0;transform:scale(1.06)}}
#text{background:var(--paper);border-radius:22px;padding:10px 16px;font-size:19px;line-height:1.4;font-weight:600;width:100%;
  box-shadow:0 5px 0 rgba(74,59,92,.15);margin:0;overflow:auto;flex-shrink:1;min-height:56px}
#text span{border-radius:6px;padding:0 1px;transition:background .1s}
#text span.now{background:var(--yellow)}
#choices{flex-shrink:0;margin-bottom:26px}

/* thinking */
#think{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;z-index:8;
  background:linear-gradient(rgba(110,198,255,.97),rgba(191,233,255,.97))}
#think.on{display:flex}
.dotdot i{display:inline-block;width:18px;height:18px;border-radius:50%;background:#fff;margin:0 6px;animation:hop 1s infinite}
.dotdot i:nth-child(2){animation-delay:.15s;background:var(--yellow)}.dotdot i:nth-child(3){animation-delay:.3s;background:var(--pink)}
@keyframes hop{30%{transform:translateY(-16px)}60%{transform:none}}

/* message */
#msg{justify-content:center;text-align:center;gap:20px}
#msgDetail{font-size:13px;font-weight:600;opacity:.7;margin:0;max-width:340px}
#msgBtn{width:150px;height:150px;border-radius:50%;background:var(--yellow);font-size:76px;box-shadow:0 10px 0 #d9a900;animation:beat 1.4s ease-in-out infinite}

/* stars at the end */
.fall{position:fixed;top:-40px;font-size:28px;z-index:9;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(115vh) rotate(360deg)}}

/* grown-ups */
#parent{background:var(--paper);overflow:auto;align-items:stretch;z-index:10;padding:18px;gap:14px}
#parent h3{margin:0;font-size:22px}
#parent label{display:flex;flex-direction:column;gap:5px;font-weight:700;font-size:15px}
#parent small{font-weight:500;opacity:.75;font-size:13px;line-height:1.35}
#parent input[type=text],#parent input[type=password],#parent select{border:2px solid #d9d0e6;border-radius:12px;padding:11px;background:#fff;font-size:16px}
#parent .row{flex-direction:row;align-items:center;gap:10px}
#parent .row input{width:22px;height:22px}
.pbtns{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.pbtn{background:var(--purple);color:#fff;border-radius:14px;padding:12px 18px;font-weight:800;font-size:16px}
.pbtn.ghost{background:#e9e2f5;color:var(--ink)}
#testOut{font-size:14px;font-weight:700;min-height:18px}
#gate{position:fixed;inset:0;background:rgba(74,59,92,.6);display:none;align-items:center;justify-content:center;z-index:20}
#gate.on{display:flex}
#gate div{background:#fff;border-radius:22px;padding:22px;display:flex;flex-direction:column;gap:12px;align-items:center;font-weight:700;width:270px}
#gate input{border:2px solid #d9d0e6;border-radius:12px;padding:10px;font-size:22px;width:120px;text-align:center}

#side{display:contents}
@media (orientation:portrait) and (max-height:640px){
  #story{padding-top:78px}#text{font-size:17px}.card{min-height:120px}.card .em{font-size:54px}#pic{max-height:36vh}
  .three .card{min-height:104px}.three .card .em{font-size:40px}
}
@media (orientation:landscape){
  #story{padding:12px 92px 12px 66px}
  #book{flex-direction:row;max-width:none;align-items:stretch}
  #pic{width:auto;height:100%;max-height:none;flex:0 0 auto;max-width:52%}
  #side{flex:1;display:flex;flex-direction:column;gap:10px;align-items:center;justify-content:center;min-width:0}
  .card{min-height:120px}.card .em{font-size:52px}
  .mascot{font-size:70px}#home{gap:8px;flex-direction:row;justify-content:center;gap:30px}#home h1{display:none}
  #go{width:150px;height:150px;font-size:76px}
}
</style>
</head>
<body data-screen="home">
<div class="cloud c1"></div><div class="cloud c2"></div>
<div class="hill"></div><div class="hill b"></div>

<button id="homeBtn" class="corner" aria-label="Home: press and hold">🏠</button>
<button id="cog" class="corner" aria-label="Grown-ups: press and hold">⚙️</button>
<button id="star" class="corner" aria-label="Stella: say it again"><span id="starFace">🌟</span></button>

<section id="home" class="screen on">
  <h1>Story Stars</h1>
  <div class="mascot">📖</div>
  <button id="go" aria-label="Tell me a story">▶</button>
  <div id="setupHint">Grown-ups: press and hold ⚙️ to set up</div>
</section>

<section id="pick" class="screen">
  <div class="choices" id="heroes"></div>
</section>

<section id="story" class="screen">
  <div id="book">
    <div id="pic"><div id="ph"><span></span></div><img id="img" alt=""></div>
    <div id="side">
      <p id="text"></p>
      <div class="choices" id="choices"></div>
    </div>
  </div>
</section>

<section id="msg" class="screen">
  <div class="mascot" id="msgEmoji">😴</div>
  <p id="msgDetail"></p>
  <button id="msgBtn" style="display:none" aria-label="Try again">🔁</button>
</section>

<section id="parent" class="screen">
  <h3>Grown-up settings</h3>
  <label>Claude API key
    <input type="password" id="pKey" autocomplete="off" placeholder="sk-ant-...">
    <small>Create one in the Claude Console (API keys). It is stored encrypted on this phone and only ever sent to api.anthropic.com.</small>
  </label>
  <div class="pbtns"><button class="pbtn ghost" id="pTest">Test key</button><span id="testOut"></span></div>
  <label>Storyteller's voice
    <select id="pVoice"></select>
    <small id="pVoiceNote">"Best female voice" picks for you. Tap "Hear it" to try each one and keep the one that sounds kindest.</small>
  </label>
  <div class="pbtns"><button class="pbtn ghost" id="pHear">🔊 Hear it</button></div>
  <label class="row"><input type="checkbox" id="pSlow"> Read slowly</label>
  <label>Child's name (optional)
    <input type="text" id="pName" maxlength="30" autocomplete="off">
    <small>Stella greets her by name and she can be the hero. Sent to Claude with the story.</small>
  </label>
  <label>Choices on each page
    <select id="pChoices"><option value="2">2 (bigger pictures, easier)</option><option value="3">3</option></select>
  </label>
  <label>Story length
    <select id="pPages"><option value="4">Short (4 pages)</option><option value="6">Medium (6 pages)</option><option value="8">Long (8 pages)</option></select>
  </label>
  <label>Pictures
    <select id="pPics"><option value="quick">Quick (Haiku: faster, cheaper)</option><option value="fancy">Fancy (Sonnet: nicer, slower, costs more)</option></select>
  </label>
  <label>Stories per day
    <select id="pDay"><option value="3">3</option><option value="5">5</option><option value="10">10</option><option value="0">No limit</option></select>
    <small id="pCount"></small>
  </label>
  <label class="row"><input type="checkbox" id="pMic"> Choose by voice</label>
  <label class="row"><input type="checkbox" id="pIdeas"> Let her say her own ideas, not only the choices</label>
  <small id="pMicNote"></small>
  <div class="pbtns">
    <button class="pbtn" id="pSave">Save</button>
    <button class="pbtn ghost" id="pMicBtn">Allow microphone</button>
    <button class="pbtn ghost" id="pCancel">Close</button>
  </div>
</section>

<div id="think"><div class="mascot" id="thinkEmoji">🌟</div><div class="dotdot"><i></i><i></i><i></i></div></div>
<div id="gate"><div><span>Grown-ups only</span><span id="gateQ"></span><input id="gateA" type="text" inputmode="numeric" autocomplete="off"><button class="pbtn" id="gateOk">OK</button></div></div>

<script>
(function () {
'use strict';
var N = window.Native;
var $ = function (id) { return document.getElementById(id); };
var cfg = {}, epoch = 0, seq = 0, paused = false;
var waits = {}, calls = {}, listenWait = null, trackId = null, nudgeTimer = null;
var story = null, current = null, shown = null, retry = null;

var HEROES = [
  ['a bouncy bunny', 'the bunny', 'bunny', '🐰'], ['a friendly little dragon', 'the dragon', 'dragon', '🐲'],
  ['a helpful robot', 'the robot', 'robot', '🤖'], ['a curious kitten', 'the kitten', 'kitten', '🐱'],
  ['a waggy puppy', 'the puppy', 'puppy', '🐶'], ['a cuddly bear', 'the bear', 'bear', '🐻'],
  ['a waddling penguin', 'the penguin', 'penguin', '🐧'], ['a sparkly unicorn', 'the unicorn', 'unicorn', '🦄'],
  ['a gentle dinosaur', 'the dinosaur', 'dinosaur', '🦕'], ['a tiny fairy', 'the fairy', 'fairy', '🧚'],
  ['a kind elephant', 'the elephant', 'elephant', '🐘'], ['a cheeky monkey', 'the monkey', 'monkey', '🐵'],
  ['a wise little owl', 'the owl', 'owl', '🦉'], ['a hoppy frog', 'the frog', 'frog', '🐸'],
  ['a clever fox', 'the fox', 'fox', '🦊'], ['a cheerful little train', 'the train', 'train', '🚂'],
  ['a busy yellow digger', 'the digger', 'digger', '🚜'], ['a sleepy koala', 'the koala', 'koala', '🐨'],
  ['a brave little mermaid-fish', 'the fish', 'fish', '🐠'], ['a fluffy lamb', 'the lamb', 'lamb', '🐑']
];
var PRAISE = ['Good choice!', 'Ooh, I like that one!', 'Yay! Here we go!', 'What a great idea!', 'Lovely!'];
var ORDER = [['one', 'first', '1', 'won'], ['two', 'second', '2', 'too'], ['three', 'third', '3', 'tree', 'free']];
var COLOUR = [['red', 'pink'], ['yellow', 'orange'], ['blue']];

function rand(a) { return a[Math.floor(Math.random() * a.length)]; }
function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
function loadCfg() { try { cfg = JSON.parse(N.getConfig()); } catch (e) { cfg = {}; } }
function canHear() { return !!(cfg.mic && cfg.micGranted && cfg.canListen); }
function show(id) {
  document.querySelectorAll('.screen').forEach(function (s) { s.classList.toggle('on', s.id === id); });
  document.body.dataset.screen = id;
}
function think(on, emoji) {
  $('think').classList.toggle('on', !!on);
  if (emoji) $('thinkEmoji').textContent = emoji;
}

/* ---------- Stella: talking and listening ---------- */
function star(state) {
  $('star').className = 'corner' + (state ? ' ' + state : '');
  $('starFace').textContent = state === 'listen' || state === 'wait' ? '👂' : '🌟';
}
function talking() { return Object.keys(waits).length > 0; }
function say(text, track) {
  if (paused || !text) return Promise.resolve(false);
  return new Promise(function (res) {
    var id = 'u' + (++seq);
    waits[id] = res; if (track) trackId = id;
    if (!listenWait) star('talk');
    N.speak(String(text), id);
  });
}
function spoken(id, ok) {
  if (!waits[id]) return;
  var r = waits[id]; delete waits[id];
  if (id === trackId) { trackId = null; mark(-1); }
  if (!talking() && !listenWait) star('');
  r(ok);
}
function listen() {
  if (paused) return Promise.resolve({ error: 'cancel' });
  return new Promise(function (res) { listenWait = res; star('wait'); N.listen(); });
}
function endListen(result) {
  if (!listenWait) return;
  var r = listenWait; listenWait = null; star(talking() ? 'talk' : ''); r(result);
}
function hush() {
  clearTimeout(nudgeTimer);
  N.hush(); N.stopListening();
  Object.keys(waits).forEach(function (k) { spoken(k, false); });
  endListen({ error: 'cancel' });
  star('');
}
/* A gentle spoken reminder if nothing has happened for a while. */
function nudge(text, ms) {
  clearTimeout(nudgeTimer);
  var e = epoch;
  nudgeTimer = setTimeout(function () { if (e === epoch && !paused && !talking() && !listenWait) say(text); }, ms);
}
function call(method, payload) {
  return new Promise(function (res) { var id = 'r' + (++seq); calls[id] = res; N[method](id, JSON.stringify(payload)); });
}

window.app = {
  on: function (ev, d) {
    if (ev === 'spoken') spoken(d, true);
    else if (ev === 'range') { if (d.id === trackId) mark(d.s); }
    else if (ev === 'heard') endListen({ heard: d });
    else if (ev === 'listenError') endListen({ error: d });
    else if (ev === 'listenState') { if (listenWait) star(d === 'ready' ? 'listen' : 'wait'); }
    else if (ev === 'result') { if (calls[d.id]) { var c = calls[d.id]; delete calls[d.id]; c(d); } }
    else if (ev === 'mic') { cfg.micGranted = !!d; fillParent(true); }
    else if (ev === 'test') { $('testOut').textContent = d.ok ? '✅ Working' : '❌ ' + (d.error || 'Failed'); }
    else if (ev === 'back') back();
    else if (ev === 'pause') { paused = true; hush(); }
    else if (ev === 'resume') { paused = false; if (current) nudge('Your turn! Tap the picture you like.', 1200); }
  }
};

/* ---------- words that light up as they are read ---------- */
function setText(t) {
  var el = $('text'); el.innerHTML = ''; el.scrollTop = 0;
  var re = /\S+/g, m;
  while ((m = re.exec(t))) {
    var s = document.createElement('span'); s.textContent = m[0]; s.dataset.s = m.index;
    el.appendChild(s); el.appendChild(document.createTextNode(' '));
  }
}
function mark(at) {
  var spans = $('text').children, hit = null;
  for (var i = 0; i < spans.length; i++) {
    spans[i].classList.remove('now');
    if (at >= 0 && +spans[i].dataset.s <= at) hit = spans[i];
  }
  if (hit) { hit.classList.add('now'); if (hit.scrollIntoView) hit.scrollIntoView({ block: 'nearest' }); }
}

/* ---------- choosing ---------- */
function words(s) { return String(s).toLowerCase().replace(/[^a-z0-9 ]/g, ' ').split(/\s+/).filter(Boolean); }

function match(heard, choices) {
  var n = choices.length;
  for (var h = 0; h < heard.length; h++) {
    var said = words(heard[h]);
    var best = -1, bestScore = 0, tie = false;
    choices.forEach(function (c, i) {
      var score = 0, key = String(c.keyword || '').toLowerCase();
      if (key && (said.indexOf(key) >= 0 || said.indexOf(key + 's') >= 0)) score += 3;
      if ((c.also || []).some(function (w) { return said.indexOf(w) >= 0; })) score += 3;
      words(c.label).forEach(function (w) { if (w.length > 3 && w !== key && said.indexOf(w) >= 0) score += 1; });
      if (score > bestScore) { best = i; bestScore = score; tie = false; }
      else if (score === bestScore && score > 0) tie = true;
    });
    if (best >= 0 && !tie) return best;
    if (said.length <= 4) {
      var i;
      for (i = 0; i < n; i++) if (said.some(function (w) { return COLOUR[i].indexOf(w) >= 0; })) return i;
      for (i = 0; i < n; i++) if (said.some(function (w) { return ORDER[i].indexOf(w) >= 0; })) return i;
      if (said.indexOf('last') >= 0) return n - 1;
    }
  }
  return -1;
}

function drawCards(el, choices) {
  el.innerHTML = '';
  el.className = 'choices' + (choices.length > 2 ? ' three' : '');
  choices.forEach(function (c, i) {
    var b = document.createElement('button'); b.className = 'card';
    var em = document.createElement('span'); em.className = 'em'; em.textContent = c.emoji || '⭐';
    var lb = document.createElement('span'); lb.textContent = c.label;
    b.appendChild(em); b.appendChild(lb);
    b.addEventListener('click', function () { if (current && current.el === el) pick(i); });
    el.appendChild(b);
  });
}
/* "Fly the kite, or Bake a cake" */
function names(choices) {
  return choices.map(function (c) { return c.short || c.label; }).join(', or ');
}

async function offer(o) {
  current = o; var e = epoch;
  var cards = Array.prototype.slice.call(o.el.children);
  var lit = function (i) { cards.forEach(function (c, j) { c.classList.toggle('lit', j === i); }); };
  o.el.classList.remove('turn');
  var ok = await say(o.question); if (e !== epoch) return;
  for (var i = 0; ok && i < o.choices.length; i++) {
    lit(i);
    ok = await say((i > 0 && i === o.choices.length - 1 ? 'Or ' : '') + (o.choices[i].say || o.choices[i].label) + '.');
    if (e !== epoch) return;
  }
  lit(-1);
  o.el.classList.add('turn');
  if (ok) await hear(e); else rest(e);
}

/* Listen for her answer. If it is not understood, say what was on offer and listen again. */
async function hear(e) {
  var o = current; if (!o) return;
  if (canHear()) {
    for (var t = 0; t < 3; t++) {
      var r = await listen(); if (e !== epoch) return;
      var ok;
      if (r.heard && r.heard.length) {
        var m = match(r.heard, o.choices);
        if (m >= 0) return pick(m);
        var idea = String(r.heard[0]).trim();
        if (o.allowIdea && cfg.ideas && idea.length >= 3) return pick(-1, idea);
        ok = await say('I heard you! Was that ' + names(o.choices) + '?');
      } else if (r.error === 'nomatch') {
        ok = await say(t === 0 ? 'Your turn! Tap a picture, or tell me. ' + names(o.choices) + '?' : 'You can tap the picture you like.');
      } else break;
      if (e !== epoch) return; if (!ok) break;
    }
  }
  rest(e);
}
function rest(e) {
  if (e !== epoch) return;
  star('');
  if (current) nudge(canHear() ? 'Tap the picture you like. Or tap me, the star, and tell me!' : 'Tap the picture you like!', 12000);
}
function pick(i, idea) {
  var o = current; if (!o) return;
  current = null; epoch++; hush();
  o.el.classList.remove('turn');
  if (i >= 0 && o.el.children[i]) o.el.children[i].classList.add('won');
  o.onPick(i, idea);
}
/* Tapping Stella: she says it again and listens again. */
function starTap() {
  if (listenWait) { N.stopListening(); endListen({ error: 'cancel' }); return; }
  var s = document.body.dataset.screen;
  if (current) { var o = current; epoch++; hush(); offer(o); }
  else if (s === 'home') { epoch++; hush(); greet(true); }
  else if (s === 'story' && shown && !talking()) say(shown.text, true);
}

/* ---------- the story ---------- */
function heroesToOffer() {
  var count = cfg.choices === 3 ? 3 : 2;
  var pool = HEROES.slice().sort(function () { return Math.random() - 0.5; }).slice(0, count)
    .map(function (h) { return { hero: h[0], label: h[1].replace(/^the /, ''), say: h[1], short: h[1], keyword: h[2], emoji: h[3] }; });
  if (cfg.childName) {
    pool[0] = {
      hero: 'a kind, curious little girl called ' + cfg.childName + ' (the child who is listening)',
      label: cfg.childName, say: 'You, ' + cfg.childName, short: 'you', keyword: 'me', emoji: '👧',
      also: words(cfg.childName).concat(['myself', 'i'])
    };
  }
  return pool;
}

function startStory() {
  loadCfg();
  epoch++; hush(); current = null;
  if (!cfg.hasKey) return message('🔧', 'Ask a grown-up to set me up!');
  if (!N.canStartStory()) return message('😴', 'All the stories are sleeping now. See you tomorrow!');
  var heroes = heroesToOffer();
  story = { hero: null, pages: [], look: '', title: '' };
  show('pick'); drawCards($('heroes'), heroes);
  offer({
    el: $('heroes'), choices: heroes, question: 'Who is our story about?', allowIdea: false,
    onPick: function (i) { story.hero = heroes[i]; turnPage(); }
  });
}

async function turnPage() {
  var e = epoch, n = story.pages.length + 1;
  retry = null;
  await sleep(500); if (e !== epoch) return;
  show('story');
  think(true, story.hero.emoji);
  var req = {
    hero: story.hero.hero, childName: cfg.childName || '', total: cfg.pages || 6, choices: cfg.choices === 3 ? 3 : 2,
    pages: story.pages.map(function (p) {
      return { text: p.text, offered: p.choices.map(function (c) { return c.label; }), chosen: p.chosen || '', idea: p.idea || '' };
    })
  };
  var both = await Promise.all([call('nextPage', req), say(n === 1 ? 'Yay! Let me think of a story.' : rand(PRAISE))]);
  if (e !== epoch) return;
  var res = both[0];
  think(false);
  if (!res.ok) { retry = turnPage; return message('🙈', 'Oops! The story got stuck. Tap the yellow button to try again.', res.error, true); }
  var p = res.page;
  story.pages.push(p);
  if (n === 1) { N.countStory(); story.look = p.look || ''; story.title = p.title || ''; }
  showPage(p);
  call('drawPicture', { hero: story.hero.hero, look: story.look, scene: p.picture }).then(function (r) {
    p.drawn = true;
    if (r.ok && r.data) p.pic = r.data;
    if (shown === p) showPic(p);
  });
  if (n === 1 && story.title) { await say(story.title + '.'); if (e !== epoch) return; }
  await say(p.text, true); if (e !== epoch) return;
  if (p.last) return theEnd(e);
  drawCards($('choices'), p.choices);
  offer({
    el: $('choices'), choices: p.choices, question: 'What happens next?', allowIdea: true,
    onPick: function (i, idea) { if (i >= 0) p.chosen = p.choices[i].label; else p.idea = idea; turnPage(); }
  });
}

function showPage(p) {
  shown = p;
  $('ph').firstElementChild.textContent = story.hero.emoji;
  setText(p.text);
  $('choices').innerHTML = ''; $('choices').className = 'choices';
  showPic(p);
}
function showPic(p) {
  var img = $('img');
  $('ph').classList.toggle('still', !!p.drawn);
  if (p.pic) { img.src = 'data:image/svg+xml;base64,' + p.pic; img.classList.add('on'); }
  else { img.classList.remove('on'); img.removeAttribute('src'); }
}
$('img').addEventListener('error', function () { $('img').classList.remove('on'); if (shown) shown.pic = null; });

async function theEnd(e) {
  starsFall();
  await say('The end!'); if (e !== epoch) return;
  var ends = [
    { label: 'Again', say: 'Hear it again', short: 'again', keyword: 'again', emoji: '📖', also: ['same', 'repeat'] },
    { label: 'New story', say: 'A new story', short: 'a new story', keyword: 'new', emoji: '🎁', also: ['another', 'different', 'more'] }
  ];
  drawCards($('choices'), ends);
  offer({
    el: $('choices'), choices: ends, question: 'What shall we do now?', allowIdea: false,
    onPick: function (i) { if (i === 0) replay(); else startStory(); }
  });
}
function starsFall() {
  for (var i = 0; i < 18; i++) {
    var s = document.createElement('div'); s.className = 'fall'; s.textContent = rand(['⭐', '🌟', '✨', '💛']);
    s.style.left = Math.random() * 100 + 'vw'; s.style.animationDuration = 2 + Math.random() * 2.5 + 's';
    s.style.animationDelay = Math.random() * 1.2 + 's';
    document.body.appendChild(s); setTimeout(function (el) { el.remove(); }, 6000, s);
  }
}
async function replay() {
  var e = epoch;
  await sleep(500); if (e !== epoch) return;
  for (var i = 0; i < story.pages.length; i++) {
    var p = story.pages[i];
    showPage(p);
    var ok = await say(p.text, true); if (e !== epoch) return;
    if (!ok) break;
    await sleep(900); if (e !== epoch) return;
  }
  theEnd(e);
}

function message(emoji, text, detail, canRetry) {
  think(false); show('msg');
  $('msgEmoji').textContent = emoji;
  $('msgDetail').textContent = detail || '';
  $('msgBtn').style.display = canRetry ? '' : 'none';
  say(text);
}
function greet(first) {
  var name = cfg.childName ? ' ' + cfg.childName : '';
  if (!cfg.hasKey) return;
  say(first ? 'Hi' + name + '! I am Stella the star. Tap the big yellow button, and I will tell you a story!'
    : 'Tap the big yellow button for another story!');
  nudge('Tap the big yellow button for a story!', 20000);
}
function goHome(first) {
  epoch++; hush(); current = null; think(false); loadCfg();
  $('setupHint').style.display = cfg.hasKey ? 'none' : 'block';
  show('home');
  greet(first === true);
}
function back() {
  var s = document.body.dataset.screen;
  if ($('gate').classList.contains('on')) return $('gate').classList.remove('on');
  if (s === 'home') return N.quit();
  if (s === 'parent') N.resetVoice();
  goHome();
}

/* ---------- press-and-hold corners (so little fingers do not leave by accident) ---------- */
function holdTo(el, ms, fn) {
  var t = null;
  var stop = function () { clearTimeout(t); el.classList.remove('holding'); };
  el.addEventListener('pointerdown', function () { el.classList.add('holding'); t = setTimeout(function () { stop(); fn(); }, ms); });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(function (ev) { el.addEventListener(ev, stop); });
}

/* ---------- grown-ups ---------- */
var gateAnswer = 0;
function openGate() {
  var a = 6 + Math.floor(Math.random() * 4), b = 6 + Math.floor(Math.random() * 4);
  gateAnswer = a * b; $('gateQ').textContent = a + ' × ' + b + ' = ?'; $('gateA').value = '';
  $('gate').classList.add('on');
}
holdTo($('cog'), 1200, openGate);
holdTo($('homeBtn'), 700, function () { goHome(); });
$('gateOk').addEventListener('click', function () {
  var right = parseInt($('gateA').value, 10) === gateAnswer;
  $('gate').classList.remove('on');
  if (right) openParent();
});
$('gate').addEventListener('click', function (ev) { if (ev.target === $('gate')) $('gate').classList.remove('on'); });

function fillVoices() {
  var list = []; try { list = JSON.parse(N.getVoices()); } catch (e) {}
  var sel = $('pVoice'); sel.innerHTML = '';
  var add = function (value, label) { var o = document.createElement('option'); o.value = value; o.textContent = label; sel.appendChild(o); };
  add('', 'Best female voice (automatic)');
  list.forEach(function (v) { add(v.name, v.label); });
  sel.value = cfg.voice || '';
  if (sel.value !== (cfg.voice || '')) sel.value = '';
  if (!list.length) $('pVoiceNote').textContent = 'No extra voices found yet. Install more in Android Settings > Text-to-speech > Install voice data.';
}
function fillParent(onlyMic) {
  if (!onlyMic) {
    $('pKey').value = '';
    $('pKey').placeholder = cfg.hasKey ? 'Saved. Type a new key to replace it' : 'sk-ant-...';
    $('pName').value = cfg.childName || '';
    $('pPages').value = String(cfg.pages || 6);
    $('pChoices').value = String(cfg.choices === 3 ? 3 : 2);
    $('pPics').value = cfg.pictures || 'quick';
    $('pDay').value = String(cfg.perDay === undefined ? 5 : cfg.perDay);
    $('pMic').checked = cfg.mic !== false; $('pIdeas').checked = cfg.ideas !== false; $('pSlow').checked = cfg.slow !== false;
    $('pCount').textContent = 'Stories started today: ' + (cfg.storiesToday || 0);
    $('testOut').textContent = '';
    fillVoices();
  }
  $('pMicBtn').style.display = cfg.micGranted ? 'none' : '';
  $('pMicNote').textContent = !cfg.canListen ? 'This phone has no speech recognition service, so choices are by tapping.'
    : cfg.micGranted ? 'Microphone allowed. Her speech is turned into text by the phone\'s own speech service.' : 'Voice choosing needs the microphone. Tap "Allow microphone".';
}
function openParent() { epoch++; hush(); current = null; loadCfg(); fillParent(); show('parent'); }
function saveParent() {
  var key = $('pKey').value.trim();
  if (key) N.setApiKey(key);
  N.saveConfig(JSON.stringify({
    childName: $('pName').value.trim(), pages: parseInt($('pPages').value, 10), choices: parseInt($('pChoices').value, 10),
    pictures: $('pPics').value, perDay: parseInt($('pDay').value, 10), voice: $('pVoice').value,
    mic: $('pMic').checked, ideas: $('pIdeas').checked, slow: $('pSlow').checked
  }));
  $('pKey').value = '';
  loadCfg();
}
$('pSave').addEventListener('click', function () { saveParent(); if (cfg.mic && !cfg.micGranted && cfg.canListen) N.askMic(); goHome(true); });
$('pCancel').addEventListener('click', function () { N.resetVoice(); goHome(); });
$('pTest').addEventListener('click', function () {
  var keep = { voice: $('pVoice').value };
  saveParent(); fillParent(true); $('pVoice').value = keep.voice;
  $('pKey').placeholder = cfg.hasKey ? 'Saved. Type a new key to replace it' : 'sk-ant-...';
  $('testOut').textContent = 'Checking…'; N.testKey();
});
$('pHear').addEventListener('click', function () { N.tryVoice($('pVoice').value, $('pSlow').checked); });
$('pMicBtn').addEventListener('click', function () { N.askMic(); });

$('star').addEventListener('click', starTap);
$('go').addEventListener('click', startStory);
$('msgBtn').addEventListener('click', function () { if (retry) { var r = retry; epoch++; hush(); r(); } });

loadCfg();
if (!cfg.hasKey) { fillParent(); show('parent'); } else goHome(true);
})();
</script>
