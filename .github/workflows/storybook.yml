name: Poppy's Picnic

on:
  push:
    paths:
      - 'game/**'
      - 'storybook-android/**'
      - '.github/workflows/storybook.yml'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
  workflow_dispatch:

permissions:
  contents: write

# One build at a time, so two pushes never race to replace the same release.
concurrency:
  group: storybook-release
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: game
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install test browser
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Play every route of the story by touch (real Chromium)
        run: npm test

  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build the Android app
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :storybook-android:assembleRelease
          cp storybook-android/build/outputs/apk/release/storybook-android-release.apk PoppysPicnic.apk
      - uses: actions/upload-artifact@v4
        with:
          name: PoppysPicnic
          path: PoppysPicnic.apk
      - name: Publish the APK for the phone
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete storybook-latest --yes --cleanup-tag || true
          gh release create storybook-latest PoppysPicnic.apk \
            --prerelease \
            --target "${GITHUB_SHA}" \
            --title "Poppy's Picnic: sample story (latest build)" \
            --notes "On your Android phone: download PoppysPicnic.apk and open it to install. Works offline. Built from ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7}."
