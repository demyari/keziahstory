name: Magical Storybook

on:
  push:
    paths:
      - 'storybook/**'
      - 'storybook-android/**'
      - '.github/workflows/storybook.yml'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
  workflow_dispatch:

permissions:
  contents: write

# One build at a time, so two pushes never race to replace the same release.
concurrency:
  group: storybook-release
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: storybook
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install test browser
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Story engine, memory, learning and save tests (includes 130,000-story variation proof)
        run: npm test
      - name: Browser tests (interactions, full story, offline, layouts)
        run: npm run test:browser

  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build the Android app
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :storybook-android:assembleRelease
          cp storybook-android/build/outputs/apk/release/storybook-android-release.apk MagicalStorybook.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MagicalStorybook
          path: MagicalStorybook.apk
      # A separate pre-release, so the Story Stars "latest" release is left alone.
      - name: Publish the APK for the phone
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete storybook-latest --yes --cleanup-tag || true
          gh release create storybook-latest MagicalStorybook.apk \
            --prerelease \
            --target "${GITHUB_SHA}" \
            --title "The Magical Storybook (latest build)" \
            --notes "On your Android phone: download MagicalStorybook.apk and open it to install. Works offline. Built from ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7}."
