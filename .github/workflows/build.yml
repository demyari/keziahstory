name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk StoryStars.apk

      - uses: actions/upload-artifact@v4
        with:
          name: StoryStars
          path: StoryStars.apk

      # Puts the APK on the repo's Releases page so it can be
      # downloaded straight onto a phone.
      - name: Publish latest build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest StoryStars.apk \
            --title "Story Stars (latest build)" \
            --notes "Download StoryStars.apk on your Android phone and open it to install."
