<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <base href="../">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Interaction harness (tests only)</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/book.css">
  <link rel="stylesheet" href="css/interactions.css">
  <style>body { overflow: auto; background: #eee; } .illus { width: 800px; margin: 10px; }</style>
</head>
<body>
  <div class="illus"><div class="play" id="play"></div></div>
  <div id="fx"></div>
  <script type="module">
    import { mountInteraction, interactionTypes } from './js/interactions/index.js';
    window.harness = {
      types: interactionTypes(),
      log: [],
      current: null,
      mount(spec) {
        const play = document.getElementById('play');
        this.current?.destroy();
        play.replaceChildren();
        this.result = null;
        this.log = [];
        const ctx = {
          layer: play,
          fx: { sparkleAt: () => {}, confetti: () => {} },
          sfx: (n) => this.log.push(['sfx', n]),
          countNote: (n) => this.log.push(['note', n]),
          say: (t, who) => this.log.push(['say', t, who || 'n']),
          learn: (kind, item, outcome) => this.log.push(['learn', kind, item, outcome]),
          companion: 'sparkle',
          done: (outcome) => { this.result = outcome; },
        };
        this.current = mountInteraction(spec, ctx);
      },
      help() { this.current.help(); },
    };
    document.title = 'ready';
  </script>
</body>
</html>
